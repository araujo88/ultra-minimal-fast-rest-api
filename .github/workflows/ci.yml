name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore: ["**.md"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["**.md"]

permissions:
  contents: read
  security-events: write # upload flawfinder SARIF to code scanning

# Runners pinned to ubuntu-22.04 so the static-analysis/test tool versions
# (cppcheck 2.7, valgrind 3.18) are stable and match what the repository was
# validated against. clang-format is pinned to an exact version via pip (below)
# so the format check is reproducible regardless of the runner image.

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: install clang-format 15
        run: pip install clang-format==15.0.7
      - name: check formatting
        run: make format-check

  static-analysis:
    needs: lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: install tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck libsqlite3-dev python3-pip

      - name: cppcheck
        run: make cppcheck

      # flawfinder. Levels 1-2 fire on every fixed-size `char` array and strlen()
      # -- inherent noise for buffer-based C, not defects (all buffers are written
      # with bounded snprintf / a length-checked builder; the code is ASan/UBSan-
      # clean and fuzzed). `--sarif` forces minlevel=0, so we filter the SARIF to
      # level>=3 (rank >= 0.6), which still catches dangerous unbounded APIs
      # (strcpy/strcat/sprintf/gets/scanf/system, level 4-5). Full report is
      # printed to the log for transparency.
      - name: flawfinder
        run: |
          python3 -m pip install flawfinder
          flawfinder --minlevel=1 src include || true
          flawfinder --sarif ./ > flawfinder.sarif
          python3 -c 'import json; d=json.load(open("flawfinder.sarif")); r=d["runs"][0]; r["results"]=[x for x in r["results"] if x.get("rank",0)>=0.6]; json.dump(d,open("flawfinder.sarif","w")); print("flawfinder: reporting", len(r["results"]), "finding(s) at level>=3")'
      - name: upload flawfinder sarif
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: flawfinder.sarif

  build:
    needs: static-analysis
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: build (strict, warnings as errors)
        run: make strict
      - name: http parser unit + fuzz tests (ASan + UBSan)
        run: make http-test

  test:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev valgrind
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: regression tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests
          make clean
          cd tests && python -m pytest -v

      - name: valgrind memcheck
        run: |
          make
          make valgrind
