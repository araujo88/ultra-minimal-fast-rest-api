name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: install dependencies
      run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

    - name: generate models and build (strict, warnings as errors)
      run: make generate_models && ./generate_models && make strict

    - name: sanitizer build + smoke test (ASan + UBSan)
      run: |
        make clean
        gcc -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer \
          -Iinclude src/*.c -o server_asan -lpthread -lsqlite3
        ./server_asan &
        SRV=$!
        sleep 2
        set -e
        curl -sf -X POST http://127.0.0.1:9002/users -d 'name=A&surname=B&age=1&height=1.0'
        curl -sf http://127.0.0.1:9002/users
        curl -sf http://127.0.0.1:9002/users/1
        # malformed / adversarial inputs must not crash the server
        printf 'GARBAGE-NO-NEWLINE' | timeout 3 nc -q1 127.0.0.1 9002 || true
        curl -sf -o /dev/null -w '%{http_code}\n' http://127.0.0.1:9002/users/abc || true
        curl -sf http://127.0.0.1:9002/users   # server still responding
        kill -INT $SRV
        wait $SRV || true

    - name: set up python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: regression tests
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest requests
        make clean
        cd tests && python -m pytest -v

    - name: flawfinder_scan
      uses: david-a-wheeler/flawfinder@2.0.19
      with:
        arguments: '--sarif ./'
        output: 'flawfinder_results.sarif'
