name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write # upload flawfinder SARIF to code scanning

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: install dependencies
      run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

    - name: generate models and build (strict, warnings as errors)
      run: make generate_models && ./generate_models && make strict

    - name: sanitizer build + smoke test (ASan + UBSan)
      run: |
        make clean
        gcc -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer \
          -Iinclude src/*.c -o server_asan -lpthread -lsqlite3
        ./server_asan &
        SRV=$!
        sleep 2
        set -e
        curl -sf -X POST http://127.0.0.1:9002/users -d 'name=A&surname=B&age=1&height=1.0'
        curl -sf http://127.0.0.1:9002/users
        curl -sf http://127.0.0.1:9002/users/1
        # malformed / adversarial inputs must not crash the server
        printf 'GARBAGE-NO-NEWLINE' | timeout 3 nc -q1 127.0.0.1 9002 || true
        curl -sf -o /dev/null -w '%{http_code}\n' http://127.0.0.1:9002/users/abc || true
        curl -sf http://127.0.0.1:9002/users   # server still responding
        kill -INT $SRV
        wait $SRV || true

    - name: set up python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: regression tests
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest requests
        make clean
        cd tests && python -m pytest -v

    # flawfinder scan. Levels 1-2 fire on every fixed-size `char` array
    # declaration and every strlen() call -- inherent noise for buffer-based C,
    # not defects: all runtime buffers are written with bounded snprintf / a
    # length-checked string builder, and the code is ASan/UBSan-clean and
    # exercised by the malformed-input regression suite. We report level 3+ to
    # code scanning, which still catches the dangerous unbounded APIs that
    # actually matter (strcpy/strcat/sprintf/gets/scanf/system -- level 4-5),
    # so any reintroduction surfaces. `--sarif` forces minlevel=0, so we filter
    # the SARIF by severity (flawfinder rank = level x 0.2; level 3 = 0.6) after
    # the fact. The full report is printed to the build log for transparency.
    - name: flawfinder_scan
      run: |
        python -m pip install flawfinder
        flawfinder --minlevel=1 src include generate_models.c || true
        flawfinder --sarif ./ > flawfinder.sarif
        python -c 'import json; d=json.load(open("flawfinder.sarif")); r=d["runs"][0]; r["results"]=[x for x in r["results"] if x.get("rank",0)>=0.6]; json.dump(d,open("flawfinder.sarif","w")); print("flawfinder: reporting", len(r["results"]), "finding(s) at level>=3")'

    - name: upload flawfinder sarif
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: flawfinder.sarif
